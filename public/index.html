<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">

  <title>Video Search</title>

  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>

  <header class="header">
    <a class="logo" href="/">Video<span>Search</span></a>

    <label class="data-saving">
      <input type="checkbox" id="dataSaver" checked>
      <span>Data saver</span>
    </label>
  </header>

  <main class="main">
    <section class="search-section">
      <h1>Find videos</h1>
      <p>Search and preview videos without opening every page.</p>

      <form id="searchForm" class="search-form">
        <input
          type="search"
          id="searchInput"
          placeholder="Search videos..."
          maxlength="150"
          autocomplete="off"
          required
        >

        <button type="submit" id="searchButton">
          Search
        </button>
      </form>
    </section>

    <div class="results-header">
      <span id="resultCount">Search for something to begin.</span>
      <span id="pageIndicator"></span>
    </div>

    <section id="results" class="results"></section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <button id="loadMoreButton" class="load-more" hidden>
      Load more
    </button>

    <div id="scrollSentinel" aria-hidden="true"></div>
  </main>

  <footer class="footer">
    Video Search · Lightweight video discovery
  </footer>

</body>
</html>
