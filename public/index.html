<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Search</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Video<span>Search</span></a><form id="searchForm" class="search-form">
  <input
    id="searchInput"
    type="search"
    placeholder="Search videos..."
    autocomplete="off"
    required
  >
  <button id="searchButton" type="submit">Search</button>
</form>

<button id="layoutToggle" class="layout-toggle" type="button">
  ▦ Bigger
</button>

  </header>  <main>
    <section class="toolbar">
      <span id="status">Search for videos</span>
      <div class="toolbar-options">
        <label class="saver-toggle">
          <input id="dataSaver" type="checkbox" checked>
          Data saver
        </label>
        <span id="resultCount"></span>
      </div>
    </section><div id="results" class="results large-cards"></div>

<div id="scrollSentinel"></div>

<div class="bottom-controls">
  <span id="pageIndicator"></span>
  <button id="loadMoreButton" type="button" hidden>Load more</button>
</div>

  </main>  <script src="/app.js" defer></script></body>
</html>
